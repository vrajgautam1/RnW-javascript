<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Dog Breeds</title>
</head>

<body>
    <!-- Container for buttons -->
    <div id="buttonContainer" class="row"></div>

    <!-- Container for images -->
    <div id="imageContainer" class="row mt-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
    <script>
        let buttonContainer = document.getElementById("buttonContainer");
        let imageContainer = document.getElementById("imageContainer");

        const data = () => {
            fetch(`https://dog.ceo/api/breeds/list/all`)
                .then((res) => res.json())
                .then((result) => {
                    let dogBreeds = result.message;

                    for (let breedName in dogBreeds) {
                        buttonContainer.innerHTML += `<button onclick="return dogPhotos('${breedName}')" class="btn btn-primary m-2 col-md-3">${breedName}</button>`;
                    }
                })
                .catch((error) => {
                    console.error(error);
                });
        };

        data();

        window.dogPhotos = (breedName) => {
            // Clear previous images
            imageContainer.innerHTML = "";

            fetch(`https://dog.ceo/api/breed/${breedName}/images`)
                .then((res) => res.json())
                .then((result) => {
                    let dogImages = result.message;

                    // Loop through and display images
                    for (let image of dogImages) {
                        imageContainer.innerHTML += `<img src="${image}" width="auto" height="200" class="col-md-4 m-2">`;
                    }
                })
                .catch((error) => {
                    console.error(error);
                });
        };
    </script>
</body>

</html>
