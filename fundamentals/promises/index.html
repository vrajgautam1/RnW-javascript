<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const fun = new Promise((response, reject) =>{
            let done = true;

            if(done){
                response("done");
            }else{
                reject("kaam nahi hua")
            }
        })

        fun.then((result)=>{
            console.log(result)
        }).catch((err)=>{
            console.log(err);
        })
    </script>
</body>
</html>
