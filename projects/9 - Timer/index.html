<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>

<body>
    <div id="main_container">
        <div class="internal_container">
            <span class="time-digit" id="hrs_time">00</span>
            <span class="time-word">HR</span>
        </div>
        <div class="internal_container">
            <span class="time-digit" id="minutes_time">00</span>
            <span class="time-word">MIN</span>
        </div>
        <div class="internal_container">
            <span class="time-digit" id="seconds_time">00</span>
            <span class="time-word">SEC</span>
        </div>
    </div>

    <div>
        <button id="start_button">Start</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
