<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider</title>
    <style>
       #slider-container {
    position: relative;
    width: 100%;
    height: 570px;
    overflow: hidden;
}

/* Style for images */
.slider img {
    position: absolute;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.5s ease;
    z-index: 1;  /* Image z-index is lower than buttons */
}

.slider img.active {
    opacity: 1;
    z-index: 2;
}

/* Style for buttons */
#prev-btn, #next-btn {
    position: absolute;
    top: 50%;  /* Center the buttons vertically */
    transform: translateY(-50%);
    background-color: rgba(0, 0, 0, 0.5);  /* Slight transparency to see the images behind */
    color: white;
    border: none;
    padding: 10px;
    cursor: pointer;
    z-index: 3;  /* Buttons have higher z-index to stay on top of the images */
}

#prev-btn {
    left: 10px;  /* Position on the left side */
}

#next-btn {
    right: 10px;  /* Position on the right side */
}

    </style>
</head>
<body>
    <div id="slider-container">
        <div class="slider">
            <!-- Images will be created here by JavaScript -->
        </div>
        <button id="prev-btn">Previous</button>
        <button id="next-btn">Next</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
