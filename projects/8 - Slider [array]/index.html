<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css"> <!-- Custom CSS should come last -->
</head>

<body>
    <div class="album py-5 d-flex justify-content-center align-items-center shadow-lg flex-column" id="main_container">
        <div class="row row-cols-1 row-cols-md-3 g-4" id="row_container">
            <!-- Card 1 -->
            <div class="col">
                <div class="card" style="width: 15rem;">
                    <img src="https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?crop=entropy&cs=tinysrgb&fit=crop&w=1920&h=1080"
                        class="card-img-top" alt="...">
                    <div class="card-body">
                        <p class="card-text">Caption for Card 1</p>
                    </div>
                </div>
            </div>
            <!-- Card 2 -->
            <div class="col">
                <div class="card" style="width: 15rem;">
                    <img src="https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?crop=entropy&cs=tinysrgb&fit=crop&w=1920&h=1080"
                        class="card-img-top" alt="...">
                    <div class="card-body">
                        <p class="card-text">Caption for Card 2</p>
                    </div>
                </div>
            </div>
            <!-- Card 3 -->
            <div class="col">
                <div class="card" style="width: 15rem;">
                    <img src="https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?crop=entropy&cs=tinysrgb&fit=crop&w=1920&h=1080"
                        class="card-img-top" alt="...">
                    <div class="card-body">
                        <p class="card-text">Caption for Card 3</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-center gap-2 mt-3">
            <a id="btn_prev" class="btn btn-primary"><i class="bi bi-chevron-compact-left"></i></a>
            <a id="btn_next" class="btn btn-primary"><i class="bi bi-chevron-compact-right"></i></a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>

    <script src="./script.js" type="module"></script>
</body>

</html>
